# Spring AI - Ollama configuration for the agentic subprocess plugin
# Adjust the base URL if Ollama is running on a different host/port
spring.ai.ollama.base-url=http://localhost:11434
# Default model used when no model is specified on the agent:config element
spring.ai.ollama.chat.options.model=llama3.1
# Read timeout for Ollama HTTP calls - local models (e.g. llama3.1) can be slow on first load
fluxnova.ai.ollama.read-timeout=300s
